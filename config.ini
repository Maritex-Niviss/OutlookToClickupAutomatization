[outlook]
; Nazwa skrzynki pośredniej dokładnie tak, jak widać ją na liście folderów w Outlooku
; (zwykle adres e-mail). `python outlook_to_clickup.pyw --check` wypisze dostępne nazwy.
mailbox = zlecenia@firma.pl
; Opcjonalny podfolder w Odebranych, np. "Zlecenia" lub "Zlecenia\Nowe". Puste = same Odebrane.
subfolder =
; Co ile sekund sprawdzać skrzynkę.
poll_interval = 60
; Przetwarzaj tylko maile od nadawców z tych domen (po przecinku). Pozostałe są oznaczane jako
; przeczytane i pomijane. Puste = wszyscy nadawcy.
allowed_domains = maritex.eu, maritex.com.pl

[documents]
; Folder, w którym powstają katalogi "DIQ26001 - Kontrahent" (najlepiej ścieżka UNC, nie litera dysku).
; root = \\serwer\udzial\Dokumentacja
root = \\sciezkanafolder
; Nazwa folderu: {prefix}{rok 2 cyfry}{numer} - {kontrahent z tematu maila}, np. DIQ26001 - Firma XYZ.
; Numeracja zaczyna się od 001 w każdym roku (rok z daty otrzymania maila).
prefix = DIQ
number_width = 3
; Folder wzorcowy - cała jego zawartość jest kopiowana do każdego nowego folderu.
template = \\sciezkanafolder\Wzorzec

[clickup]
; Adres Email-to-Task listy ClickUp (Lista -> ... -> Email to List -> Copy email).
address = a.t.1200640000006768.u-284597303.690801b7-1ccb-40ba-be92-f238b6f61424@tasks.clickup.com
; Nazwa zadania: {subject} = temat maila bez "PD:"/"RE:" (razem z tagami ClickUp, np. <tag pilne>),
; {folder} = nazwa utworzonego folderu, {name} = sam kontrahent. Np. "{folder} {subject}".
subject = {subject}
; Przypisz zadanie osobie, która przesłała maila na skrzynkę pośrednią (dopisuje <assign jej@adres>).
; Tag <assign me> w temacie też jest zamieniany na tę osobę.
assign_sender = yes
