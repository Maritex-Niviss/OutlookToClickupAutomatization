; =====================================================================================
;  ClickUp Exchange Bridge - konfiguracja
;  Po każdej zmianie: Stop-ScheduledTask / Start-ScheduledTask 'ClickUp Exchange Bridge'
;  (najpierw warto sprawdzić: python exchange_to_clickup.py --check)
; =====================================================================================


; -------------------------------------------------------------------------------------
;  1. Połączenie z Exchange Online (od admina)
; -------------------------------------------------------------------------------------
[exchange]
; Identyfikator katalogu (tenant) Entra ID firmy.
tenant_id = 00000000-0000-0000-0000-000000000000
; Identyfikator aplikacji (klienta) zarejestrowanej w Entra ID.
; Sekret aplikacji NIE trafia do tego pliku: python exchange_to_clickup.py --set-secret
client_id = 00000000-0000-0000-0000-000000000000
; Skrzynka pośrednia, na którą handlowcy wysyłają maile.
mailbox = skrzynka.posrednia@firma.eu
; Opcjonalny podfolder w Odebranych, np. "Zlecenia" lub "Zlecenia\Nowe". Puste = same Odebrane.
subfolder =
; Co ile sekund sprawdzać skrzynkę.
poll_interval = 60


; -------------------------------------------------------------------------------------
;  2. Które maile są przetwarzane
; -------------------------------------------------------------------------------------
[mail]
; Tylko nadawcy z tych domen (po przecinku). Maile od innych są po cichu oznaczane jako
; przeczytane i pomijane. Puste = wszyscy nadawcy.
allowed_domains = firma.eu, firma.com.pl
; Kategoria dla maili, których temat nie zaczyna się od żadnej kategorii (DIQ, RFQ, C, R).
; Puste = takie maile są pomijane, a nadawca dostaje informację "Nie przetworzono: ...".
default_type =


; -------------------------------------------------------------------------------------
;  3. Zadania w ClickUp (wspólne dla wszystkich kategorii)
; -------------------------------------------------------------------------------------
[clickup]
; Nazwa zadania:
;   {folder}  = nazwa folderu, np. "DIQ26145 - Firma XYZ"; dla projektów "CTM2601 - Lattice"
;   {tags}    = tagi ClickUp z tematu (<assign ...>, <tag pilne> itp. - ClickUp usuwa je z nazwy)
;   {subject} = temat maila bez "PD:"/"RE:" i bez kategorii, razem z tagami
;   {name}    = sam kontrahent
subject = {folder} {tags}
; Przypisz zadanie osobie, która wysłała maila na skrzynkę pośrednią (dopisuje <assign jej@adres>).
; Tag <assign me> w temacie też jest zamieniany na tę osobę.
assign_sender = yes
; Stopka w treści zadania jest wycinana od linii zaczynającej się od jednego z tych zwrotów
; (wielkość liter bez znaczenia). Domyślnie: Pozdrawiam, Z poważaniem, Best regards, Regards itp.
; signature_markers = Pozdrawiam, Z poważaniem, Best regards, Kind regards, Regards


; -------------------------------------------------------------------------------------
;  4. Kategorie - słowo na początku tematu maila decyduje, która sekcja jest użyta
; -------------------------------------------------------------------------------------
;  [type NAZWA]      NAZWA = słowo w temacie i prefiks folderów; [type C, R] = dwie kategorie
;                    o tych samych ustawieniach
;  layout          = year    -> <root>\<rok>\DIQ26001 - Firma XYZ
;                              (folder roku, np. 2027, zakładany automatycznie)
;                    company -> <root>\<Firma>\CTM2601
;                              (folder firmy = nazwa z tematu bez spacji; jeśli już istnieje,
;                              powstaje w nim tylko nowy projekt)
;  root            = folder nadrzędny (ścieżka UNC, nie litera dysku)
;  template        = folder wzorcowy - jego zawartość jest kopiowana do każdego nowego folderu
;  clickup_address = adres Email-to-Task listy ClickUp (Lista -> ... -> Email to List -> Copy email)
;  number_width    = cyfry numeru w roku (domyślnie 3 dla year: 001, 2 dla company: 01)
;  cipher_shift    = tylko company: przesunięcie szyfru Cezara dla kodu firmy (domyślnie 8)

; "DIQ Firma XYZ" -> DIQ_Internal_quote\2026\DIQ26001 - Firma XYZ
[type DIQ]
layout = year
root = \\serwer\udzial\Projekty\DIQ_Internal_quote
template = \\serwer\udzial\Projekty\DIQ_Internal_quote\ZZ_DIQ-TEMPLATE
clickup_address = lista@tasks.clickup.com

; "RFQ Firma XYZ" -> RFQ\2026\RFQ26001 - Firma XYZ
[type RFQ]
layout = year
root = \\serwer\udzial\Projekty\RFQ
template = \\serwer\udzial\Projekty\RFQ\ZZ_RFQ-TEMPLATE
clickup_address = lista@tasks.clickup.com

; "C Lattice" -> C_R_Projects\Lattice\CTM2601, "R Lattice" -> C_R_Projects\Lattice\RTM2601
; Kod: C/R + pierwsza i ostatnia litera firmy przesunięte o 8 (L->T, e->M) + rok + numer w roku.
[type C, R]
layout = company
root = \\serwer\udzial\Projekty\C_R_Projects
template = \\serwer\udzial\Projekty\C_R_Projects\ZZ_CR-TEMPLATE
clickup_address = lista@tasks.clickup.com


; -------------------------------------------------------------------------------------
;  5. Trasy - inna lista ClickUp dla wybranych nadawców
; -------------------------------------------------------------------------------------
;  [route NAZWA]     zadania od nadawców z listy trafiają na clickup_address tej trasy zamiast
;                    na listę kategorii - dla WSZYSTKICH kategorii (DIQ, RFQ, C, R). Folder na
;                    dysku powstaje jak zwykle. Przy kilku trasach wygrywa pierwsza pasująca.
;  senders         = pełne adresy e-mail nadawców (po przecinku, wielkość liter bez znaczenia)
;  clickup_address = adres Email-to-Task listy ClickUp
;  create_folders  = yes (domyślnie) - folder na dysku jak zwykle, zmienia się tylko lista ClickUp
;                    no  - TYLKO zadanie w ClickUp: nic na dysku, kategoria w temacie niewymagana,
;                          nazwa zadania = temat maila (bez PD:/RE:)

; [route nowy workspace]
; senders = jan.kowalski@firma.eu, anna.nowak@firma.eu
; clickup_address = inna-lista@tasks.clickup.com
; create_folders = no
